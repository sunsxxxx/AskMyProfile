[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "interview-ai-backend"
version = "0.1.0"
description = "FastAPI and LangGraph backend for a personal interview assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "redis[hiredis]>=5.2,<7",
  "httpx>=0.28,<1",
  "langchain>=1.2,<2",
  "langchain-core>=1.2,<2",
  "langchain-community>=0.4,<1",
  "langchain-openai>=1.1,<2",
  "langchain-text-splitters>=1.0,<2",
  "langgraph>=1.1,<2",
  "langchain-redis>=0.2.4,<0.3",
  "langgraph-checkpoint-redis>=0.4,<1",
  "dashscope>=1.24,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "fakeredis[lua]>=2.28,<3",
  "respx>=0.22,<1",
  "asgi-lifespan>=2.1,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
